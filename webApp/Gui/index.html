<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icons/icons8-emoji-de-mão-acenando-48.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>App</title>
</head>
<body class="flex flex-col overflow-x-hidden">

    <main class="w-full flex ">
        <div class="w-1/2 flex flex-col items-center justify-center h-full ">
            <img class=" w-80 h-80" src="https://img.freepik.com/premium-vector/woman-with-cat-working-laptop_556150-322.jpg?ga=GA1.1.1006316347.1744572537&semt=ais_hybrid&w=740" alt="">
            <h1 class="text-2xl font-light">Query database</h1>
        </div>
    
        <div class="w-1/2 flex flex-col items-center justify-center h-full">
            <button class="defaultQueryBtn w-auto h-auto py-2 px-5 rounded-full bg-purple-500 text-white text-white text-md hover:bg-purple-800" type="button">
                Default Query
            </button>
        </div>
    </main>


    <div class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-20 w-auto defaultQueryTable w-full h-auto flex justify-center px-40 hidden">
        <button class="exitBtn absolute -top-9 right-40 px-9 py-1 bg-purple-500 rounded-md text-white hover:bg-purple-800" type="button">Sair</button>

        <iframe class="Poppins border border rounded-sm border-black bg-white" src="queries/pureQuery.html" width="100%" height="500px"></iframe>
    </div>




    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        * {
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
            transition: .2s ease;
        }

        body {
            width: 100vw;
            height: 100vh;
        }

        main {
            height: 100vh;
        }

        .Poppins {
            font-family: "Poppins", sans-serif;
        }
    </style>

    <script src="js/script.js"></script>
</body>
</html>
